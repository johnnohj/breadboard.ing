/** Extract connector positions (SVG viewBox coords) from an SVG string.
 *  Reads pin center coordinates from element attributes and applies
 *  only the element's own transform. This is a best-effort initial pass;
 *  the precise positions are read from the live DOM in readConnectorPositionsFromRenderedPart().
 *  Returns a map of { connectorId: {x, y} } for connectors whose
 *  pin element exists in the SVG. */
function parseConnectorPositionsFromSvg(svgContent, connectors) {
  const parser = new DOMParser();
  const svgDoc = parser.parseFromString(svgContent, 'image/svg+xml');
  const positions = {};
  
  for (const conn of connectors) {
    const pinEl = svgDoc.getElementById(conn.id + 'pin');
    if (!pinEl) continue;
    
    let cx = 0, cy = 0;
    const tag = pinEl.tagName.toLowerCase();
    if (tag === 'rect') {
      const x = parseFloat(pinEl.getAttribute('x') || 0);
      const y = parseFloat(pinEl.getAttribute('y') || 0);
      const w = parseFloat(pinEl.getAttribute('width') || 6);
      const h = parseFloat(pinEl.getAttribute('height') || 6);
      cx = x + w / 2;
      cy = y + h / 2;
    } else if (tag === 'circle') {
      cx = parseFloat(pinEl.getAttribute('cx') || 0);
      cy = parseFloat(pinEl.getAttribute('cy') || 0);
    } else if (tag === 'ellipse') {
      cx = parseFloat(pinEl.getAttribute('cx') || 0);
      cy = parseFloat(pinEl.getAttribute('cy') || 0);
    } else continue;
    
    positions[conn.id] = { x: cx, y: cy };
  }
  return positions;
}

/** Read connector positions from a part that is already rendered on the canvas.
 *  Uses getBBox() on the live SVG DOM elements to get correct viewBox-space
 *  coordinates. Updates part.connector_positions and returns the positions map. */
function readConnectorPositionsFromRenderedPart(partId) {
  const state = canvasState.parts.find(p => p.id === partId);
  if (!state) return {};
  const part = findPartInDB(state.partId);
  if (!part) return {};
  
  const div = document.getElementById('cp-' + partId);
  if (!div) return {};
  
  const svg = div.querySelector('svg');
  if (!svg) return {};
  
  const positions = {};
  const connectors = part.connectors || [];
  
  for (const conn of connectors) {
    const pinEl = svg.getElementById(conn.id + 'pin');
    if (!pinEl) continue;
    try {
      const bbox = pinEl.getBBox();
      if (bbox && isFinite(bbox.x) && isFinite(bbox.y)) {
        positions[conn.id] = {
          x: bbox.x + bbox.width / 2,
          y: bbox.y + bbox.height / 2
        };
      }
    } catch (e) {}
  }
  
  console.log('[renderPart] readConnectorPositions for', partId, JSON.stringify(positions));
  return positions;
}

/** Compute SVG units per 0.1" grid cell from SVG content metadata.
 *  Follows Fritzing's convention: DPI = viewBox_width / physical_width,
 *  then grid_spacing = DPI / 10.
 *  Handles width in inches ("in") or millimeters ("mm").
 *  Returns null when metadata is unavailable. */
function computeGridSpacingFromSvg(svgContent) {
  const wInMatch = svgContent.match(/width="([\d.]+)in"/);
  const wMmMatch = svgContent.match(/width="([\d.]+)mm"/);
  const vbMatch = svgContent.match(/viewBox="[\d.-]+ [\d.-]+ ([\d.]+) ([\d.]+)"/);
  if (!vbMatch) return null;
  const vbW = parseFloat(vbMatch[1]);
  let physInches;
  if (wInMatch) {
    physInches = parseFloat(wInMatch[1]);
  } else if (wMmMatch) {
    physInches = parseFloat(wMmMatch[1]) / 25.4;
  } else {
    return null;
  }
  const dpi = vbW / physInches;
  return dpi / 10;
}

/** Infer SVG units per 0.1" grid cell from connector positions.
 *  Finds the most common gap between adjacent connectors in the same row/column.
 *  Returns a positive number, or null when insufficient data. */
function inferGridSpacingFromConnectors(connectorPositions) {
  const entries = Object.entries(connectorPositions);
  if (entries.length < 3) return null;
  const rows = new Map();
  for (const [, pos] of entries) {
    const ry = Math.round(pos.y * 10) / 10;
    if (!rows.has(ry)) rows.set(ry, []);
    rows.get(ry).push(pos.x);
  }
  let bestRow = [];
  for (const xs of rows.values()) {
    if (xs.length > bestRow.length) bestRow = xs;
  }
  bestRow.sort((a, b) => a - b);
  let gaps;
  if (bestRow.length >= 3) {
    gaps = [];
    for (let i = 1; i < bestRow.length; i++) {
      gaps.push(Math.round((bestRow[i] - bestRow[i-1]) * 100) / 100);
    }
  } else {
    const cols = new Map();
    for (const [, pos] of entries) {
      const rx = Math.round(pos.x * 10) / 10;
      if (!cols.has(rx)) cols.set(rx, []);
      cols.get(rx).push(pos.y);
    }
    let bestCol = [];
    for (const ys of cols.values()) {
      if (ys.length > bestCol.length) bestCol = ys;
    }
    bestCol.sort((a, b) => a - b);
    if (bestCol.length < 3) return null;
    gaps = [];
    for (let i = 1; i < bestCol.length; i++) {
      gaps.push(Math.round((bestCol[i] - bestCol[i-1]) * 100) / 100);
    }
  }
  if (!gaps || gaps.length === 0) return null;
  const freq = {};
  let maxCount = 0, bestGap = null;
  for (const g of gaps) {
    freq[g] = (freq[g] || 0) + 1;
    if (freq[g] > maxCount) { maxCount = freq[g]; bestGap = g; }
  }
  if (bestGap && bestGap > 0.5 && bestGap < 50) return bestGap;
  return null;
}

/** Parse bus definitions from a Fritzing FZP XML document. */
function parseBusesFromFzp(doc) {
  const buses = [];
  const busEls = doc.querySelectorAll('bus');
  busEls.forEach(busEl => {
    const busId = busEl.getAttribute('id') || '';
    const members = [];
    busEl.querySelectorAll('nodeMember').forEach(m => {
      const cid = m.getAttribute('connectorId');
      if (cid) members.push(cid);
    });
    if (busId && members.length > 0) {
      buses.push({ id: busId, members });
    }
  });
  // Also try under <buses> namespace
  if (buses.length === 0) {
    doc.querySelectorAll('module buses bus, module > buses > bus').forEach(busEl => {
      const busId = busEl.getAttribute('id') || '';
      const members = [];
      busEl.querySelectorAll('nodeMember').forEach(m => {
        const cid = m.getAttribute('connectorId');
        if (cid) members.push(cid);
      });
      if (busId && members.length > 0) {
        buses.push({ id: busId, members });
      }
    });
  }
  return buses;
}

/** Parse properties from Fritzing FZP XML. */
function parsePropertiesFromFzp(doc) {
  const props = {};
  doc.querySelectorAll('property').forEach(prop => {
    const name = prop.getAttribute('name');
    if (name) props[name] = prop.textContent || '';
  });
  return props;
}

/** Parse tags from Fritzing FZP XML. */
function parseTagsFromFzp(doc) {
  const tags = [];
  doc.querySelectorAll('tag').forEach(t => {
    const text = t.textContent;
    if (text) tags.push(text.trim());
  });
  return tags;
}

/** Extract the breadboard SVG image path from a Fritzing FZP XML document. */
function getBreadboardSvgPathFromFzp(doc) {
  const layers = doc.querySelector('breadboardView layers');
  return layers ? layers.getAttribute('image') || '' : '';
}

/** Parse a Fritzing .fzp XML string and extract part metadata.
 *  Returns { title, moduleId, connectors, buses, properties, tags, svgPath }
 *  (svgPath is the breadboard SVG path from the fzp). */
function parseFzpXml(fzpXml) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(fzpXml, 'text/xml');
  
  // Get the <module> or root element
  const module = doc.querySelector('module') || doc.documentElement;
  if (!module) throw new Error('Not a valid Fritzing .fzp file');
  
  const moduleId = module.getAttribute('moduleId') || '';
  const title = (module.querySelector('title') || {}).textContent || moduleId || 'Unknown';
  
  // Parse connectors
  const connectors = [];
  module.querySelectorAll('connector').forEach(conn => {
    const connId = conn.getAttribute('id');
    if (!connId) return;
    connectors.push({
      id: connId,
      name: conn.getAttribute('name') || connId,
      type: conn.getAttribute('type') || '',
      description: (conn.querySelector('description') || {}).textContent || ''
    });
  });
  
  const buses = parseBusesFromFzp(doc);
  const properties = parsePropertiesFromFzp(doc);
  const tags = parseTagsFromFzp(doc);
  const svgPath = getBreadboardSvgPathFromFzp(doc);
  
  return { title, moduleId, connectors, buses, properties, tags, svgPath };
}

/** Handle a dropped .fzpz file. */
async function handleDroppedFritzingFile(file, dropEvent) {
  const rect = wrapper.getBoundingClientRect();
  const vp = canvasState.viewport;
  
  try {
    await handleFzpzFile(file, dropEvent, rect, vp);
  } catch (e) {
    console.error('Failed to load dropped Fritzing file:', e);
    document.getElementById('statusText').textContent = '❌ Error: ' + e.message;
    setTimeout(() => updateStatus(), 3000);
  }
}

/** Handle a dropped .fzpz file (self-contained zip archive). */
async function handleFzpzFile(file, dropEvent, rect, vp) {
  const arrayBuffer = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(arrayBuffer);
  
  // Find the .fzp file inside the archive
  let fzpEntry = null;
  let fzpName = '';
  for (const [name, entry] of Object.entries(zip.files)) {
    if (name.endsWith('.fzp') && !entry.dir) {
      fzpEntry = entry;
      fzpName = name;
      break;
    }
  }
  if (!fzpEntry) throw new Error('No .fzp file found inside the .fzpz archive');
  
  const fzpXml = await fzpEntry.async('string');
  const meta = parseFzpXml(fzpXml);
  
  // Find and load the breadboard SVG from the zip
  let svgContent = null;
  const svgFilename = meta.svgPath.split('/').pop();
  
  // Try matching by the breadboard SVG filename
  for (const [name, entry] of Object.entries(zip.files)) {
    if (name.endsWith('.svg') && !entry.dir) {
      if (name.endsWith('/' + svgFilename) || name === svgFilename) {
        svgContent = await entry.async('string');
        break;
      }
    }
  }
  
  // Fallback: any SVG with 'breadboard' in the name
  if (!svgContent) {
    for (const [name, entry] of Object.entries(zip.files)) {
      if (name.endsWith('.svg') && name.includes('breadboard') && !entry.dir) {
        svgContent = await entry.async('string');
        break;
      }
    }
  }
  
  // Last resort: any SVG at all
  if (!svgContent) {
    for (const [name, entry] of Object.entries(zip.files)) {
      if (name.endsWith('.svg') && !entry.dir) {
        svgContent = await entry.async('string');
        break;
      }
    }
  }
  
  if (!svgContent) throw new Error('No SVG found in the .fzpz archive');
  
  console.log('[fzpz] Importing', file.name, '->', meta.title, 'moduleId:', meta.moduleId);
  await placeDroppedPart(meta, svgContent, dropEvent, rect, vp, file.name);
}

/** Register a part from a dropped file and place it on the canvas.
 *  If a part with the same moduleId already exists (e.g. re-import),
 *  it replaces the old entry and refreshes existing canvas instances. */
async function placeDroppedPart(meta, svgContent, dropEvent, rect, vp, fileName) {
  // Generate an ID based on moduleId
  const baseId = 'dropped_' + (meta.moduleId || Date.now().toString(36));
  
  // Check if this part was imported before
  const existingIdx = partsDB.findIndex(p => p.id === baseId);
  console.log('[fzpz] placeDroppedPart baseId:', baseId, 'reimport:', existingIdx !== -1, 'connectors:', meta.connectors ? meta.connectors.length : 0);
  
  // Cache the SVG so loadSvgForPart can find it
  droppedPartSvg[baseId] = svgContent;
  svgCache[baseId] = svgContent;
  
  // Compute connector positions from the SVG
  const connPositions = parseConnectorPositionsFromSvg(svgContent, meta.connectors);
  console.log('[fzpz] connector_positions:', JSON.stringify(connPositions));
  
  // Build fresh part metadata entry
  const partMeta = {
    id: baseId,
    type: 'fzpz',
    title: meta.title,
    source: 'dropped',
    category: 'user',
    group: 'Dropped Parts',
    connectors: meta.connectors,
    connector_positions: connPositions,
    svg_refs: null,
    fzpz_file: null,
    properties: meta.properties,
    buses: meta.buses,
    tags: meta.tags,
    grid_snap_points: [],
    grid_spacing_svg: null
  };
  
  // Remove old entry if re-importing, so we replace rather than pile up duplicates
  if (existingIdx !== -1) {
    console.log('[fzpz] REPLACING old entry at idx', existingIdx);
    // Remove old partsDB entry (splice preserves order)
    partsDB.splice(existingIdx, 1);
    // Delete old IndexedDB entry
    dbDeleteDroppedPart(baseId).catch(() => {});
  }
  
  // Add the new entry
  partsDB.push(partMeta);
  console.log('[fzpz] partsDB now has', partsDB.filter(p => p.id && p.id.startsWith('dropped_')).length, 'dropped entries');
  
  // Persist to IndexedDB (put overwrites by same key)
  dbPutDroppedPart({ id: baseId, title: meta.title, svgContent, metadata: partMeta });
  
  // Re-render any existing canvas part instances that reference this partId
  let rerendered = 0;
  for (const state of canvasState.parts) {
    if (state.partId === baseId) {
      console.log('[fzpz] re-rendering existing instance', state.id);
      renderPart(state.id);
      rerendered++;
    }
  }
  console.log('[fzpz] rerendered', rerendered, 'existing instances of', baseId);
  
  // Compute drop position (centered under cursor)
  const rawX = (dropEvent.clientX - rect.left - vp.x) / vp.scale - 50;
  const rawY = (dropEvent.clientY - rect.top - vp.y) / vp.scale - 25;
  
  const id = 'p' + (nextPartId++);
  const displayScale = getPartDisplayScale(partMeta);
  const rawState = { partId: baseId, x: rawX, y: rawY, displayScale };
  const snapped = snapWithPart(rawState, rawX, rawY);
  const newState = { partId: baseId, id, x: snapped.x, y: snapped.y, rotation: 0, displayScale };
  canvasState.parts.push(newState);
  
  await renderPart(id);
  const conns = getConnectorWorldPositions(newState);
  if (conns.length > 0) {
    for (const otherState of canvasState.parts) {
      if (otherState.id === newState.id) continue;
      const otherConns = getConnectorWorldPositions(otherState);
      if (otherConns.length === 0) continue;
      
      let bestDist = Infinity;
      let bestOffset = null;
      for (const dc of conns) {
        for (const oc of otherConns) {
          const dx = oc.absX - dc.absX;
          const dy = oc.absY - dc.absY;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < bestDist) {
            bestDist = dist;
            bestOffset = {dx, dy};
          }
        }
      }
      
      if (bestDist < CONNECTOR_SNAP_THRESHOLD && bestOffset) {
        newState.x = newState.x + bestOffset.dx;
        newState.y = newState.y + bestOffset.dy;
        const div = document.getElementById('cp-' + id);
        if (div) {
          div.style.left = newState.x + 'px';
          div.style.top = newState.y + 'px';
        }
        const wireCount = autoConnectMatedConnectors(newState.id, otherState.id, newState, otherState);
        if (wireCount > 0) {
          renderWires();
        }
      }
    }
  }
  
  updateStatus();
  saveStateToUrl();
  hideEmptyState();
  document.getElementById('statusText').textContent = '✅ Dropped "' + meta.title + '" from ' + fileName + '';
  setTimeout(() => updateStatus(), 3000);
}

/** Remove all dropped part entries from partsDB and clear the SVG cache. */
function cleanupDroppedParts() {
  // Remove entries whose ids start with 'dropped_'
  const origLen = partsDB.length;
  partsDB = partsDB.filter(p => !p.id || !p.id.startsWith('dropped_'));
  // Also clear the dropped SVG cache
  for (const key of Object.keys(droppedPartSvg)) {
    delete svgCache[key];
  }
  for (const key of Object.keys(droppedPartSvg)) {
    delete droppedPartSvg[key];
  }
  // Clear from IndexedDB
  dbClearDroppedParts();
}

/** Remove a single dropped part entry from partsDB if it was a dropped part. */
function cleanupSingleDroppedPart(partId) {
  // The partId is like 'p1' but the DB entry has partId like 'dropped_xxx'.
  // Find the state to get its partId.
  const state = canvasState.parts.find(p => p.id === partId);
  if (!state) return;
  const dbId = state.partId;
  if (!dbId || !dbId.startsWith('dropped_')) return;
  partsDB = partsDB.filter(p => p.id !== dbId);
  delete svgCache[dbId];
  delete droppedPartSvg[dbId];
  dbDeleteDroppedPart(dbId);
}

/** Load all persisted dropped parts from IndexedDB and re-register them.
 *  Called once at startup after parts_index.json is loaded. */
async function loadDroppedPartsFromDb() {
  let records;
  try {
    records = await dbGetAllDroppedParts();
  } catch (e) {
    console.warn('Failed to load dropped parts from IndexedDB:', e);
    return;
  }
  if (!records || records.length === 0) return;
  
  for (const record of records) {
    const partId = record.id;
    if (!partId || findPartInDB(partId)) continue; // already registered
    
    // Restore SVG cache
    droppedPartSvg[partId] = record.svgContent;
    
    // Restore partsDB entry
    partsDB.push(record.metadata);
  }
  
  console.log('Restored ' + records.length + ' dropped part(s) from IndexedDB');
}

async function renderPart(partId) {
  const state = canvasState.parts.find(p => p.id === partId);
  if (!state) return;
  const part = findPartInDB(state.partId);
  if (!part) return;
  
  const existing = document.getElementById('cp-' + partId);
  if (existing) existing.remove();
  
  let svgContent;
  try {
    svgContent = await loadSvgForPart(part);
  } catch (e) {
    console.error('Failed to load SVG for', part.title, e);
    return;
  }
  
  // Compute this part's initial display scale
  state.displayScale = getPartDisplayScale(part);
  drawGrid();
  
  const parser = new DOMParser();
  const svgDoc = parser.parseFromString(svgContent, 'image/svg+xml');
  const svgEl = svgDoc.querySelector('svg');
  let vb = svgEl.getAttribute('viewBox');
  if (!vb) {
    const w = parseFloat(svgEl.getAttribute('width') || 100);
    const h = parseFloat(svgEl.getAttribute('height') || 100);
    vb = '0 0 ' + w + ' ' + h;
  }
  const vbParts = vb.split(/\s+/).map(Number);
  const vbMinX = vbParts[0] || 0;
  const vbMinY = vbParts[1] || 0;
  const svgW = vbParts[2] || 100;
  const svgH = vbParts[3] || 100;
  // Store SVG dimensions on state for rotation-aware position calculations
  state.svgW = svgW;
  state.svgH = svgH;
  state.svgViewboxOffsetX = vbMinX;
  state.svgViewboxOffsetY = vbMinY;
  
  let ds = state.displayScale || SVG_SCALE;
  let dispW = svgW * ds;
  let dispH = svgH * ds;
  
  const div = document.createElement('div');
  div.id = 'cp-' + partId;
  div.className = 'canvas-part';
  div.style.left = state.x + 'px';
  div.style.top = state.y + 'px';
  div.style.width = dispW + 'px';
  div.style.height = dispH + 'px';
  if (state.rotation) {
    div.style.transform = `rotate(${state.rotation}deg)`;
  }
  div.dataset.partId = partId;
  
  div.innerHTML = `<div style="width:${dispW}px;height:${dispH}px;overflow:hidden">${svgContent}</div>`;
  
  const innerSvg = div.querySelector('svg');
  if (innerSvg) {
    innerSvg.setAttribute('width', dispW + 'px');
    innerSvg.setAttribute('height', dispH + 'px');
    innerSvg.style.width = dispW + 'px';
    innerSvg.style.height = dispH + 'px';
    innerSvg.setAttribute('viewBox', vb);
    innerSvg.removeAttribute('transform');
  }
  
  // Append to container FIRST so the SVG is in the live DOM for getBBox()
  container.appendChild(div);
  
  // Read connector positions from the live rendered SVG
  const livePositions = readConnectorPositionsFromRenderedPart(partId);
  
  // Compute grid_spacing_svg if not provided by the part index
  if (!part.grid_spacing_svg) {
    let gss = computeGridSpacingFromSvg(svgContent);
    if (!gss && Object.keys(livePositions).length >= 3) {
      gss = inferGridSpacingFromConnectors(livePositions);
    }
    if (gss && gss > 0.5 && gss < 50) {
      part.grid_spacing_svg = gss;
      state.displayScale = SVG_SCALE * DEFAULT_GRID_SVG / gss;
      ds = state.displayScale;
      dispW = svgW * ds;
      dispH = svgH * ds;
      div.style.width = dispW + 'px';
      div.style.height = dispH + 'px';
      if (innerSvg) {
        innerSvg.setAttribute('width', dispW + 'px');
        innerSvg.setAttribute('height', dispH + 'px');
        innerSvg.style.width = dispW + 'px';
        innerSvg.style.height = dispH + 'px';
      }
      const wrapper = div.querySelector('div:first-child');
      if (wrapper) {
        wrapper.style.width = dispW + 'px';
        wrapper.style.height = dispH + 'px';
      }
      drawGrid();
    }
  }
  
  // Ensure positions are stored
  part.connector_positions = livePositions;
  
  // Now create overlay connector pin divs using the live positions
  const connectors = part.connectors || [];
  connectors.forEach(conn => {
    const pos = livePositions[conn.id];
    if (!pos) return;
    
    const sx = ((pos.x - vbMinX) / svgW) * dispW;
    const sy = ((pos.y - vbMinY) / svgH) * dispH;
    
    const pinDiv = document.createElement('div');
    pinDiv.className = 'connector-pin';
    pinDiv.style.left = (sx - 5) + 'px';
    pinDiv.style.top = (sy - 5) + 'px';
    pinDiv.style.width = '10px';
    pinDiv.style.height = '10px';
    pinDiv.dataset.partId = partId;
    pinDiv.dataset.connectorId = conn.id;
    pinDiv.title = conn.name || conn.id;
    
    pinDiv.onmousedown = (e) => {
      e.stopPropagation();
      // If a wire is above this connector, select the wire instead of starting a new one
      const rect = wrapper.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      const hitWireId = findWireAtPoint(clickX, clickY);
      if (hitWireId) {
        selectPart(null);
        selectWire(hitWireId);
        return;
      }
      startWireDrawing(partId, conn.id, e);
    };
    pinDiv.addEventListener('mouseenter', (e) => {
      // If a wire passes through this connector area, highlight the wire instead
      const rect = wrapper.getBoundingClientRect();
      const pinRect = pinDiv.getBoundingClientRect();
      const cx = pinRect.left + pinRect.width / 2 - rect.left;
      const cy = pinRect.top + pinRect.height / 2 - rect.top;
      const hitWireId = findWireAtPoint(cx, cy);
      if (hitWireId) {
        highlightWire(hitWireId);
        return;
      }
      showConnectorLabel(partId, conn.id, conn.name || conn.id, pinDiv);
    });
    pinDiv.addEventListener('mouseleave', () => {
      unhighlightWire();
      hideConnectorLabel();
    });
    
    div.querySelector('div:first-child').appendChild(pinDiv);
  });
  
  makePartDraggable(div);
  
  // Draw a marker at the part's origin with snap point info
  const originMarker = document.createElement('div');
  originMarker.className = 'part-origin-marker';
  originMarker.style.cssText = 'position:absolute;left:-4px;top:-4px;width:8px;height:8px;pointer-events:none;z-index:10;';
  originMarker.innerHTML = '<svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="2.5" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.8"/><line x1="0" y1="4" x2="8" y2="4" stroke="#4fc3f7" stroke-width="0.5" opacity="0.4"/><line x1="4" y1="0" x2="4" y2="8" stroke="#4fc3f7" stroke-width="0.5" opacity="0.4"/></svg>';
  div.appendChild(originMarker);
  

  
  // Draw persistent snap point anchor markers
  const snapPoints = computeGridSnapPoints(part, ds);
  const cp = part.connector_positions || {};
  if (snapPoints.length > 0) {
    const seenAnchors = new Set();
    for (const sp of snapPoints) {
      if (seenAnchors.has(sp.anchor)) continue;
      seenAnchors.add(sp.anchor);
      const ap = cp[sp.anchor];
      if (!ap) continue;
      const sx = ((ap.x - vbMinX) / svgW) * dispW;
      const sy = ((ap.y - vbMinY) / svgH) * dispH;
      const marker = document.createElement('div');
      marker.className = 'snap-anchor-marker';
      marker.style.cssText = `position:absolute;left:${sx - 4}px;top:${sy - 4}px;width:8px;height:8px;pointer-events:none;z-index:9;`;
      marker.innerHTML = '<svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="2.5" fill="none" stroke="#e53935" stroke-width="1.5" opacity="0.7"/><line x1="0" y1="4" x2="8" y2="4" stroke="#e53935" stroke-width="0.5" opacity="0.4"/><line x1="4" y1="0" x2="4" y2="8" stroke="#e53935" stroke-width="0.5" opacity="0.4"/></svg>';
      marker.title = `${sp.onGrid.length} connectors on this grid`;
      div.querySelector('div:first-child').appendChild(marker);
    }
  }
  
  renderWires();
}

function makePartDraggable(div) {
  let dragging = false, startX, startY, origX, origY;
  let snapped = false; // track if we snapped during this drag
  
  div.onmousedown = (e) => {
    if (e.target.classList.contains('connector-pin')) return;
    dragging = true;
    snapped = false;
    // Hide toolbar while dragging
    selectionToolbar.classList.remove('visible');
    selectPart(div.dataset.partId);
    const st = canvasState.parts.find(p => p.id === div.dataset.partId);
    if (!st) return;
    
    // Remove auto-created wires immediately so they don't show during drag
    canvasState.wires = canvasState.wires.filter(w => {
      if ((w.f === st.id || w.t === st.id) && w.auto) {
        if (w.id === selectedWire) selectedWire = null;
        return false;
      }
      return true;
    });
    renderWires();
    updateStatus();
    
    startX = e.clientX; startY = e.clientY;
    origX = st.x; origY = st.y;
    
    const onMove = (ev) => {
      if (!dragging) return;
      
      // Clear previous snap-target highlights
      document.querySelectorAll('.connector-pin.snap-target').forEach(el => el.classList.remove('snap-target'));
      
      const vp = canvasState.viewport;
      const rawX = origX + (ev.clientX - startX) / vp.scale;
      const rawY = origY + (ev.clientY - startY) / vp.scale;
      
      // Grid snap using connector-based snap points
      const snappedPos = snapWithPart(st, rawX, rawY);
      st.x = snappedPos.x;
      st.y = snappedPos.y;
      
      // Connector-aware snapping: check if any connectors align with other parts
      const draggedConns = getConnectorWorldPositions(st);
      let foundSnap = false;
      if (draggedConns.length > 0) {
        for (const otherState of canvasState.parts) {
          if (otherState.id === st.id) continue;
          const otherConns = getConnectorWorldPositions(otherState);
          if (otherConns.length === 0) continue;
          
          // Find the closest connector pair
          let bestDist = Infinity;
          let bestOffset = null;
          let bestDc = null;
          let bestOc = null;
          for (const dc of draggedConns) {
            for (const oc of otherConns) {
              const dx = oc.absX - dc.absX;
              const dy = oc.absY - dc.absY;
              const dist = Math.sqrt(dx*dx + dy*dy);
              if (dist < bestDist) {
                bestDist = dist;
                bestOffset = {dx, dy};
                bestDc = dc;
                bestOc = oc;
              }
            }
          }
          
          // Show snap target highlight on connectors close to matching
          if (debugShowSnap && bestDist < CONNECTOR_SNAP_THRESHOLD && bestDc && bestOc) {
            foundSnap = true;
            // Highlight matching connectors on the dragged part
            document.querySelectorAll(`#cp-${st.id} .connector-pin[data-connector-id="${bestDc.connectorId}"]`).forEach(
              el => el.classList.add('snap-target')
            );
            // Highlight matching connectors on the other part
            document.querySelectorAll(`#cp-${otherState.id} .connector-pin[data-connector-id="${bestOc.connectorId}"]`).forEach(
              el => el.classList.add('snap-target')
            );
          }
          
          // If close enough, snap the dragged part to align connectors precisely
          if (bestDist < CONNECTOR_SNAP_THRESHOLD && bestOffset) {
            st.x = st.x + bestOffset.dx;
            st.y = st.y + bestOffset.dy;
            snapped = true;
          }
        }
      }
      
      // Highlight on-grid connectors based on current snap position
      const part = findPartInDB(st.partId);
      const curSnapPoints = part ? computePartSnapPoints(part) : [];
      if (debugShowSnap && curSnapPoints.length > 0) {
        // Clear previous on-grid highlights
        document.querySelectorAll(`#cp-${st.id} .connector-pin.on-grid`).forEach(el => el.classList.remove('on-grid'));
        document.querySelectorAll(`#cp-${st.id} .connector-pin.snap-anchor`).forEach(el => el.classList.remove('snap-anchor'));
        
        // Find which snap point we're closest to
        let closestSp = null, closestD = Infinity;
        for (const sp of curSnapPoints) {
          const tx = Math.round((st.x - sp.remXPx) / GRID_PX) * GRID_PX + sp.remXPx;
          const ty = Math.round((st.y - sp.remYPx) / GRID_PX) * GRID_PX + sp.remYPx;
          const d = Math.hypot(tx - st.x, ty - st.y);
          if (d < closestD) { closestD = d; closestSp = sp; }
        }
        
        if (closestSp && closestD < 1 && debugShowSnap) {
          for (const cid of closestSp.onGridConnectorIds) {
            document.querySelectorAll(`#cp-${st.id} .connector-pin[data-connector-id="${cid}"]`).forEach(
              el => el.classList.add('on-grid')
            );
          }
          // Highlight the anchor connector in red to show which point drives the snap
          document.querySelectorAll(`#cp-${st.id} .connector-pin[data-connector-id="${closestSp.anchorConnectorId}"]`).forEach(
            el => el.classList.add('snap-anchor')
          );
        }
      }
      
      // Show/hide status hint about snap availability
      if (foundSnap && !snapped) {
        document.getElementById('statusText').textContent = '🎯 Connector snap available!';
      } else if (foundSnap && snapped) {
        // Clear snap-target highlights after snapping
        document.querySelectorAll('.connector-pin.snap-target').forEach(el => el.classList.remove('snap-target'));
      }
      
      div.style.left = st.x + 'px';
      div.style.top = st.y + 'px';
      renderWires();
    };
    const onUp = () => {
      dragging = false;
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      
      // Clean up any leftover snap-target highlights
      document.querySelectorAll('.connector-pin.snap-target').forEach(el => el.classList.remove('snap-target'));
      
      // Check if the dragged part is aligned with any other part's connectors
      // at its final position (not just at some point during the drag).
      const finalConns = getConnectorWorldPositions(st);
      let finalSnapFound = false;
      for (const otherState of canvasState.parts) {
        if (otherState.id === st.id) continue;
        const otherConns = getConnectorWorldPositions(otherState);
        if (otherConns.length === 0) continue;
        for (const dc of finalConns) {
          for (const oc of otherConns) {
            if (Math.hypot(oc.absX - dc.absX, oc.absY - dc.absY) < CONNECTOR_SNAP_THRESHOLD) {
              finalSnapFound = true;
              break;
            }
          }
          if (finalSnapFound) break;
        }
        if (finalSnapFound) break;
      }

      if (finalSnapFound) {
        // Part is aligned with another part — auto-connect mated connectors
        let wireCount = 0;
        for (const otherState of canvasState.parts) {
          if (otherState.id === st.id) continue;
          wireCount += autoConnectMatedConnectors(st.id, otherState.id, st, otherState);
        }
        renderWires();
        updateStatus();
        if (wireCount > 0) {
          document.getElementById('statusText').textContent = 
            `🔗 Connected ${wireCount} wire${wireCount > 1 ? 's' : ''}!`;
          // Flash snapped connectors green briefly
          setTimeout(() => {
            document.querySelectorAll('.connector-pin.snapped').forEach(el => el.classList.remove('snapped'));
          }, 1500);
          setTimeout(() => { document.getElementById('statusText').textContent = ''; updateStatus(); }, 2000);
        }
      } else {
        renderWires();
        updateStatus();
      }
      
      // Re-show toolbar after drag
      updateSelectionToolbar();
      
      saveStateToUrl();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  };
}

function selectPart(partId) {
  document.querySelectorAll('.canvas-part').forEach(el => el.classList.remove('selected'));
  if (partId) {
    const el = document.getElementById('cp-' + partId);
    if (el) el.classList.add('selected');
  }
  updateSelectionToolbar();
  renderWires();
}

// ===== SELECTION TOOLBAR =====
const selectionToolbar = document.getElementById('selectionToolbar');

function updateSelectionToolbar() {
  const sel = document.querySelector('.canvas-part.selected');
  const partActions = document.getElementById('partActions');
  const wireActions = document.getElementById('wireActions');
  
  if (!sel) {
    if (!selectedWire) {
      selectionToolbar.classList.remove('visible');
    }
    return;
  }
  
  // If a wire is also selected, deselect wire
  if (selectedWire) {
    selectWire(null);
  }
  
  wireActions.classList.remove('visible');
  partActions.style.display = '';
  
  // Position the toolbar above the selected part, centered horizontally
  const wrapperRect = wrapper.getBoundingClientRect();
  const partRect = sel.getBoundingClientRect();
  
  // Position relative to the canvas wrapper
  const toolbarLeft = partRect.left - wrapperRect.left + (partRect.width / 2);
  const toolbarTop = partRect.top - wrapperRect.top - 42;
  
  selectionToolbar.style.left = toolbarLeft + 'px';
  selectionToolbar.style.top = toolbarTop + 'px';
  
  // Shift left by half toolbar width (will be centered via transform)
  selectionToolbar.style.transform = 'translateX(-50%)';
  selectionToolbar.classList.add('visible');
}

function deleteSelected() {
  const sel = document.querySelector('.canvas-part.selected');
  if (sel) {
    deletePart(sel.dataset.partId);
    selectionToolbar.classList.remove('visible');
  }
}

function rotateSelected(degrees) {
  const sel = document.querySelector('.canvas-part.selected');
  if (!sel) return;
  const st = canvasState.parts.find(p => p.id === sel.dataset.partId);
  if (!st) return;
  st.rotation = ((st.rotation + degrees) % 360 + 360) % 360;
  sel.style.transform = `rotate(${st.rotation}deg)`;
  renderWires();
  saveStateToUrl();
  // Reposition toolbar after rotation (part size may change visually)
  updateSelectionToolbar();
}

function zOrderSelected(action) {
  const sel = document.querySelector('.canvas-part.selected');
  if (!sel) return;
  const partId = sel.dataset.partId;
  const containerEl = document.getElementById('partsContainer');
  const el = document.getElementById('cp-' + partId);
  if (!el) return;
  
  switch (action) {
    case 'front':
      // Move to end of container (highest z-order by DOM order)
      containerEl.appendChild(el);
      break;
    case 'back':
      // Move to beginning of container (lowest z-order)
      containerEl.insertBefore(el, containerEl.firstChild);
      break;
    case 'forward':
      // Swap with next sibling
      if (el.nextElementSibling) {
        el.parentNode.insertBefore(el.nextElementSibling, el);
      }
      break;
    case 'backward':
      // Swap with previous sibling
      if (el.previousElementSibling) {
        el.parentNode.insertBefore(el, el.previousElementSibling);
      }
      break;
  }
  
  // Update z-index of all parts: DOM order determines visual stacking
  // Elements later in the DOM appear on top
  // Also set explicit z-index to work with the hover z-index:100 rule
  const parts = containerEl.querySelectorAll('.canvas-part');
  parts.forEach((p, i) => {
    // Base z-index starts at 1, incremented by DOM position
    // The hover rule still works because z-index:100 overrides on hover
    p.style.zIndex = (i + 1).toString();
  });
  
  updateSelectionToolbar();
  saveStateToUrl();
}

// ===== WIRE SELECTION & MANAGEMENT =====

/** Sample points along a cubic bezier and check distance from (px, py) */
function hitTestCubicBezier(x1, y1, cx1, cy1, cx2, cy2, x2, y2, px, py, threshold) {
  const steps = 30;
  for (let t = 0; t <= 1; t += 1/steps) {
    const mt = 1 - t;
    const mt2 = mt * mt;
    const t2 = t * t;
    const bx = mt2*mt * x1 + 3*mt2*t * cx1 + 3*mt*t2 * cx2 + t2*t * x2;
    const by = mt2*mt * y1 + 3*mt2*t * cy1 + 3*mt*t2 * cy2 + t2*t * y2;
    if (Math.hypot(bx - px, by - py) < threshold) return true;
  }
  return false;
}

/** Find the topmost wire at the given wrapper-relative coordinates */
function findWireAtPoint(px, py) {
  const rect = wrapper.getBoundingClientRect();
  // Iterate in reverse (topmost wires drawn last)
  for (let i = canvasState.wires.length - 1; i >= 0; i--) {
    const w = canvasState.wires[i];
    const fromPin = getConnectorPin(w.f, w.fc);
    const toPin = getConnectorPin(w.t, w.tc);
    if (!fromPin || !toPin) continue;
    
    const fRect = fromPin.getBoundingClientRect();
    const tRect = toPin.getBoundingClientRect();
    const x1 = fRect.left + fRect.width/2 - rect.left;
    const y1 = fRect.top + fRect.height/2 - rect.top;
    const x2 = tRect.left + tRect.width/2 - rect.left;
    const y2 = tRect.top + tRect.height/2 - rect.top;
    
    const vp = canvasState.viewport;
    const wc = computeWireCurve(x1, y1, x2, y2, w.curve, vp.scale);
    
    if (hitTestCubicBezier(x1, y1, wc.cx1, wc.cy1, wc.cx2, wc.cy2, x2, y2, px, py, 8)) {
      return w.id;
    }
  }
  return null;
}

function highlightWire(wireId) {
  if (highlightedWire === wireId) return;
  unhighlightWire();
  highlightedWire = wireId;
  document.querySelectorAll(`path[data-wire-id="${wireId}"]`).forEach(path => {
    path.classList.add('wire-hovered');
  });
}

function unhighlightWire() {
  if (highlightedWire) {
    document.querySelectorAll(`path[data-wire-id="${highlightedWire}"]`).forEach(path => {
      path.classList.remove('wire-hovered');
    });
    highlightedWire = null;
  }
}

function selectWire(wireId) {
  selectedWire = wireId;
  document.querySelectorAll('.connector-pin.net-highlight').forEach(el => el.classList.remove('net-highlight'));
  renderWires();
  updateWireSelectionToolbar();
  if (wireId) updateStatus();
}

function deleteSelectedWire() {
  if (!selectedWire) return;
  const idx = canvasState.wires.findIndex(w => w.id === selectedWire);
  if (idx === -1) return;
  canvasState.wires.splice(idx, 1);
  selectedWire = null;
  document.getElementById('wireCurveHandle')?.remove();
  renderWires();
  updateStatus();
  updateWireSelectionToolbar();
  saveStateToUrl();
}

function changeWireColor(color) {
  if (!selectedWire) return;
  const wire = canvasState.wires.find(w => w.id === selectedWire);
  if (!wire) return;
  wire.color = color;
  renderWires();
  saveStateToUrl();
}

function resetWireCurve() {
  if (!selectedWire) return;
  const wire = canvasState.wires.find(w => w.id === selectedWire);
  if (!wire) return;
  wire.curve = 0;
  renderWires();
  saveStateToUrl();
}

function updateWireSelectionToolbar() {
  const partActions = document.getElementById('partActions');
  const wireActions = document.getElementById('wireActions');
  
  if (selectedWire) {
    partActions.style.display = 'none';
    wireActions.classList.add('visible');
    selectionToolbar.classList.add('visible');
    
    const wire = canvasState.wires.find(w => w.id === selectedWire);
    if (wire) {
      document.getElementById('wireColorPicker').value = wire.color || '#ffaa00';
    }
    
    // Position toolbar near the midpoint of the selected wire
    const fromPin = getConnectorPin(wire.f, wire.fc);
    const toPin = getConnectorPin(wire.t, wire.tc);
    if (fromPin && toPin) {
      const wrapperRect = wrapper.getBoundingClientRect();
      const fRect = fromPin.getBoundingClientRect();
      const tRect = toPin.getBoundingClientRect();
      const x1 = fRect.left + fRect.width/2 - wrapperRect.left;
      const y1 = fRect.top + fRect.height/2 - wrapperRect.top;
      const x2 = tRect.left + tRect.width/2 - wrapperRect.left;
      const y2 = tRect.top + tRect.height/2 - wrapperRect.top;
      
      const vp = canvasState.viewport;
      const tp = computeToolbarPosition(x1, y1, x2, y2, wire.curve, vp.scale);
      selectionToolbar.style.left = tp.left + 'px';
      selectionToolbar.style.top = tp.top + 'px';
      selectionToolbar.style.transform = tp.transform;
    } else {
      // Fallback: top center
      const wrapperRect = wrapper.getBoundingClientRect();
      selectionToolbar.style.left = (wrapperRect.width / 2) + 'px';
      selectionToolbar.style.top = '12px';
      selectionToolbar.style.transform = 'translateX(-50%)';
    }
  } else if (document.querySelector('.canvas-part.selected')) {
    // Part is selected - handled by updateSelectionToolbar
    wireActions.classList.remove('visible');
    partActions.style.display = '';
  } else {
    wireActions.classList.remove('visible');
    partActions.style.display = '';
    selectionToolbar.classList.remove('visible');
  }
}

// ===== WIRE COLOR =====
/** Map of connector name patterns to wire colors.
 *  Matched case-insensitively against connector name and its first word.
 *  Colors: red for power, black for ground, blue for SDA, yellow for SCL,
 *  orange for TX, green for RX, white for control signals. */
const CONNECTOR_COLOR_MAP = [
  { pattern: /^vcc|^vdd|^v\+|^3v|^3\.3v|^5v|^vin|^power|^vbat|^bat|^\+/i, color: '#e53935' },
  { pattern: /^gnd|^ground|^vss|^v-|^0v|^vref-/i, color: '#424242' },
  { pattern: /^sda|^sdi|^dio|^data/i, color: '#1e88e5' },
  { pattern: /^scl|^sck|^clk|^clock/i, color: '#fdd835' },
  { pattern: /^tx|^txd|^tx-/i, color: '#fb8c00' },
  { pattern: /^rx|^rxd|^rx-/i, color: '#43a047' },
  { pattern: /^cs|^ce|^en|^enable|^reset|^rst/i, color: '#ffffff' },
];

/** Get the connector info (with name) from the parts database for a canvas part. */
function getConnectorInfo(partId, connectorId) {
  const state = canvasState.parts.find(p => p.id === partId);
  if (!state) return null;
  const part = findPartInDB(state.partId);
  if (!part || !part.connectors) return null;
  return part.connectors.find(c => c.id === connectorId) || null;
}

/** Check a connector name against known patterns, return the named color or null. */
function getNamedWireColor(partId, connectorId) {
  const conn = getConnectorInfo(partId, connectorId);
  if (!conn || !conn.name) return null;
  const name = conn.name.trim();
  for (const entry of CONNECTOR_COLOR_MAP) {
    if (entry.pattern.test(name)) {
      return entry.color;
    }
  }
  return null;
}

/** Van der Corput sequence — produces evenly-spaced hue values.
 *  n=0 → 0°, n=1 → 180°, n=2 → 90°, n=3 → 270°, n=4 → 45°, n=5 → 225°, …
 *  This guarantees well-separated hues for any number of wires. */
let wireHueIndex = 0;
function vanDerCorput(n) {
  let result = 0;
  let denominator = 1;
  while (n > 0) {
    denominator *= 2;
    result += (n % 2) / denominator;
    n = Math.floor(n / 2);
  }
  return result;
}
function getNextHueBasedColor() {
  const hue = vanDerCorput(wireHueIndex) * 360;
  wireHueIndex++;
  return `hsl(${hue}, 80%, 55%)`;
}

/** Pick the best wire color for a connection between two connectors.
 *  Priority:
 *  1. Named color from connector names (power → red, gnd → black, etc.)
 *     — checks both connectors, preferring the first match
 *  2. Hue-based color from the evenly-spaced sequence */
function pickWireColor(fromPartId, fromConnectorId, toPartId, toConnectorId) {
  // Try named colors from both connector names
  const c1 = getNamedWireColor(fromPartId, fromConnectorId);
  if (c1) return c1;
  const c2 = getNamedWireColor(toPartId, toConnectorId);
  if (c2) return c2;
  // Fall back to hue-based color
  return getNextHueBasedColor();
}

// ===== WIRE DRAWING =====
function startWireDrawing(partId, connectorId, e) {
  const div = document.getElementById('cp-' + partId);
  if (!div) return;
  const rect = wrapper.getBoundingClientRect();
  const pinEl = div.querySelector(`[data-connector-id="${connectorId}"]`);
  if (!pinEl) return;
  
  const pinRect = pinEl.getBoundingClientRect();
  const sx = pinRect.left + pinRect.width/2 - rect.left;
  const sy = pinRect.top + pinRect.height/2 - rect.top;
  
  wireDrawing = { fromPartId: partId, fromConnector: connectorId, startX: sx, startY: sy };
  
  const line = document.getElementById('wireDrawingLine');
  line.style.display = 'block';
  const tl = document.getElementById('tempWireLine');
  tl.setAttribute('x1', sx); tl.setAttribute('y1', sy);
  tl.setAttribute('x2', sx); tl.setAttribute('y2', sy);
  
  document.getElementById('statusText').innerHTML = 
    '🔌 Click a connector to connect. <span style="cursor:pointer;color:#ff0" onclick="cancelWireDrawing()">[Cancel]</span>';
  
  // Show yellow circle on the source connector
  pinEl.classList.add('wire-source');
  // Potential target highlighted dynamically in onMove
  let prevTarget = null;
  const onMove = (ev) => {
    if (!wireDrawing) return;
    tl.setAttribute('x2', ev.clientX - rect.left);
    tl.setAttribute('y2', ev.clientY - rect.top);
    
    // Remove highlight from previous target (but not the source)
    if (prevTarget && prevTarget !== pinEl) {
      prevTarget.classList.remove('wire-source');
    }
    prevTarget = null;
    
    // Highlight potential target connector under cursor
    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    if (target && target.classList.contains('connector-pin') && target.dataset.connectorId !== connectorId) {
      target.classList.add('wire-source');
      prevTarget = target;
    }
  };
  const onUp = (ev) => {
    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    if (target && target.classList.contains('connector-pin') && target.dataset.connectorId !== connectorId) {
      completeWire(target.dataset.partId, target.dataset.connectorId);
    }
    cancelWireDrawing();
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function cancelWireDrawing() {
  wireDrawing = null;
  document.getElementById('wireDrawingLine').style.display = 'none';
  document.querySelectorAll('.connector-pin').forEach(el => el.classList.remove('wire-source'));
}

function completeWire(toPartId, toConnector) {
  if (!wireDrawing) return;
  const exists = canvasState.wires.some(w => 
    (w.f === wireDrawing.fromPartId && w.fc === wireDrawing.fromConnector && w.t === toPartId && w.tc === toConnector) ||
    (w.f === toPartId && w.fc === toConnector && w.t === wireDrawing.fromPartId && w.tc === wireDrawing.fromConnector)
  );
  if (!exists) {
    canvasState.wires.push({
      id: 'w' + (nextWireId++),
      f: wireDrawing.fromPartId, fc: wireDrawing.fromConnector,
      t: toPartId, tc: toConnector,
      color: pickWireColor(wireDrawing.fromPartId, wireDrawing.fromConnector, toPartId, toConnector),
      curve: 0
    });
    renderWires();
    updateStatus();
    saveStateToUrl();
  }
  wireDrawing = null;
}

function renderWires() {
  const svg = wiresSvg;
  svg.innerHTML = '';
  
  const rect = wrapper.getBoundingClientRect();
  const selPart = document.querySelector('.canvas-part.selected');
  
  canvasState.wires.forEach(w => {
    const fromPin = getConnectorPin(w.f, w.fc);
    const toPin = getConnectorPin(w.t, w.tc);
    if (!fromPin || !toPin) return;
    
    const fRect = fromPin.getBoundingClientRect();
    const tRect = toPin.getBoundingClientRect();
    const x1 = fRect.left + fRect.width/2 - rect.left;
    const y1 = fRect.top + fRect.height/2 - rect.top;
    const x2 = tRect.left + tRect.width/2 - rect.left;
    const y2 = tRect.top + tRect.height/2 - rect.top;
    
    const partHl = selPart && (w.f === selPart.dataset.partId || w.t === selPart.dataset.partId);
    const wireSel = (selectedWire === w.id);
    const isSelected = wireSel || partHl;
    
    const vp = canvasState.viewport;
    const wc = computeWireCurve(x1, y1, x2, y2, w.curve, vp.scale);
    
    const strokeColor = wireSel ? '#4fc3f7' : (w.color || '#ffaa00');
    const strokeWidth = wireSel ? '3.5' : (partHl ? '3' : '2');
    
    // Draw the visible cubic bezier path
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const d = `M ${x1} ${y1} C ${wc.cx1} ${wc.cy1}, ${wc.cx2} ${wc.cy2}, ${x2} ${y2}`;
    path.setAttribute('d', d);
    path.setAttribute('stroke', strokeColor);
    path.setAttribute('stroke-width', strokeWidth);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('data-wire-id', w.id);
    path.classList.add('wire-selectable');
    if (wireSel) path.classList.add('wire-selected');
    svg.appendChild(path);
    
    // Draw a wider invisible path for easier click targeting (used by isPointInStroke)
    const hitPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hitPath.setAttribute('d', d);
    hitPath.setAttribute('stroke', 'transparent');
    hitPath.setAttribute('stroke-width', '14');
    hitPath.setAttribute('fill', 'none');
    hitPath.setAttribute('data-wire-id', w.id);
    hitPath.setAttribute('data-hit', '1');
    svg.appendChild(hitPath);
    
    // Endpoint dots
    const dotColor = wireSel ? '#4fc3f7' : (w.color || '#ffaa00');
    for (const [ex, ey] of [[x1, y1], [x2, y2]]) {
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', ex); dot.setAttribute('cy', ey);
      dot.setAttribute('r', '2.5');
      dot.setAttribute('fill', dotColor);
      svg.appendChild(dot);
    }
    
    // Debug: show Bezier control points
    if (debugShowSnap) {
      // Tangent line from start to control point 1
      const tan1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      tan1.setAttribute('x1', x1); tan1.setAttribute('y1', y1);
      tan1.setAttribute('x2', wc.cx1); tan1.setAttribute('y2', wc.cy1);
      tan1.setAttribute('stroke', '#e53935'); tan1.setAttribute('stroke-width', '1');
      tan1.setAttribute('stroke-dasharray', '3,3'); tan1.setAttribute('opacity', '0.6');
      svg.appendChild(tan1);
      
      // Tangent line from control point 2 to end
      const tan2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      tan2.setAttribute('x1', wc.cx2); tan2.setAttribute('y1', wc.cy2);
      tan2.setAttribute('x2', x2); tan2.setAttribute('y2', y2);
      tan2.setAttribute('stroke', '#e53935'); tan2.setAttribute('stroke-width', '1');
      tan2.setAttribute('stroke-dasharray', '3,3'); tan2.setAttribute('opacity', '0.6');
      svg.appendChild(tan2);
      
      // Control point 1 circle (hollow)
      const cp1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      cp1.setAttribute('cx', wc.cx1); cp1.setAttribute('cy', wc.cy1);
      cp1.setAttribute('r', '3.5');
      cp1.setAttribute('fill', 'none'); cp1.setAttribute('stroke', '#e53935');
      cp1.setAttribute('stroke-width', '1.5'); cp1.setAttribute('opacity', '0.8');
      svg.appendChild(cp1);
      
      // Control point 1 center dot
      const cp1dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      cp1dot.setAttribute('cx', wc.cx1); cp1dot.setAttribute('cy', wc.cy1);
      cp1dot.setAttribute('r', '1.5');
      cp1dot.setAttribute('fill', '#e53935'); cp1dot.setAttribute('opacity', '0.9');
      svg.appendChild(cp1dot);
      
      // Control point 2 circle (hollow)
      const cp2 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      cp2.setAttribute('cx', wc.cx2); cp2.setAttribute('cy', wc.cy2);
      cp2.setAttribute('r', '3.5');
      cp2.setAttribute('fill', 'none'); cp2.setAttribute('stroke', '#e53935');
      cp2.setAttribute('stroke-width', '1.5'); cp2.setAttribute('opacity', '0.8');
      svg.appendChild(cp2);
      
      // Control point 2 center dot
      const cp2dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      cp2dot.setAttribute('cx', wc.cx2); cp2dot.setAttribute('cy', wc.cy2);
      cp2dot.setAttribute('r', '1.5');
      cp2dot.setAttribute('fill', '#e53935'); cp2dot.setAttribute('opacity', '0.9');
      svg.appendChild(cp2dot);
      
      // Midpoint of the curve (t=0.5) marker
      const mid = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      mid.setAttribute('cx', wc.mpx); mid.setAttribute('cy', wc.mpy);
      mid.setAttribute('r', '2');
      mid.setAttribute('fill', '#ffaa00'); mid.setAttribute('opacity', '0.7');
      svg.appendChild(mid);
    }
  });
  
  // Update wire curve handle
  updateWireCurveHandle();
}

/** Update or remove the wire curve drag handle */
function updateWireCurveHandle() {
  let handle = document.getElementById('wireCurveHandle');
  if (!selectedWire) {
    if (handle) handle.remove();
    return;
  }
  
  const w = canvasState.wires.find(w => w.id === selectedWire);
  if (!w) {
    if (handle) handle.remove();
    selectedWire = null;
    return;
  }
  
  const fromPin = getConnectorPin(w.f, w.fc);
  const toPin = getConnectorPin(w.t, w.tc);
  if (!fromPin || !toPin) {
    if (handle) handle.remove();
    return;
  }
  
  const rect = wrapper.getBoundingClientRect();
  const fRect = fromPin.getBoundingClientRect();
  const tRect = toPin.getBoundingClientRect();
  const x1 = fRect.left + fRect.width/2 - rect.left;
  const y1 = fRect.top + fRect.height/2 - rect.top;
  const x2 = tRect.left + tRect.width/2 - rect.left;
  const y2 = tRect.top + tRect.height/2 - rect.top;
  
  const vp = canvasState.viewport;
  const wc = computeWireCurve(x1, y1, x2, y2, w.curve, vp.scale);
  
  // Curve handle at midpoint of the cubic bezier (t=0.5)
  // B(0.5) = (P0 + 3*P1 + 3*P2 + P3) / 8
  // With P1 = start + (end-start)/3 + offset, P2 = end - (end-start)/3 + offset:
  // B(0.5) = midpoint + 0.75 * offset in perpendicular direction
  const hx = (x1 + x2) / 2 + 0.75 * wc.nx * wc.offset;
  const hy = (y1 + y2) / 2 + 0.75 * wc.ny * wc.offset;
  
  if (!handle) {
    handle = document.createElement('div');
    handle.id = 'wireCurveHandle';
    handle.className = 'wire-curve-handle';
    handle.title = 'Drag to bend wire';
    wrapper.appendChild(handle);
    
    handle.onmousedown = (e) => {
      e.stopPropagation();
      e.preventDefault();
      wireCurveDragging = { wireId: selectedWire };
      const onMove = (ev) => {
        if (!wireCurveDragging) return;
        const wire = canvasState.wires.find(ww => ww.id === wireCurveDragging.wireId);
        if (!wire) { cancelWireCurveDrag(); return; }
        
        const fp = getConnectorPin(wire.f, wire.fc);
        const tp = getConnectorPin(wire.t, wire.tc);
        if (!fp || !tp) { cancelWireCurveDrag(); return; }
        
        const r = wrapper.getBoundingClientRect();
        const fr = fp.getBoundingClientRect();
        const tr = tp.getBoundingClientRect();
        const px1 = fr.left + fr.width/2 - r.left;
        const py1 = fr.top + fr.height/2 - r.top;
        const px2 = tr.left + tr.width/2 - r.left;
        const py2 = tr.top + tr.height/2 - r.top;
        
        const pdx = px2 - px1;
        const pdy = py2 - py1;
        const plen = Math.hypot(pdx, pdy) || 1;
        const pnx = -pdy / plen;
        const pny = pdx / plen;
        
        // Mouse position in wrapper coordinates
        const mxx = ev.clientX - r.left;
        const myy = ev.clientY - r.top;
        
        // The handle is at midpoint + 0.75 * offset (perpendicular)
        // So the perpendicular distance from the line's midpoint to mouse
        // needs to be divided by 0.75 to get the effective offset,
        // then divided by vp.scale to store in canvas space
        const pmx = (px1 + px2) / 2;
        const pmy = (py1 + py2) / 2;
        const dist = (mxx - pmx) * pnx + (myy - pmy) * pny;
        const vp = canvasState.viewport;
        wire.curve = Math.round((dist / 0.75 / vp.scale) * 10) / 10;
        
        renderWires();
        saveStateToUrl();
      };
      const onUp = () => {
        wireCurveDragging = null;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };
  }
  
  // Adjust handle position for current viewport
  const wrapperRect = wrapper.getBoundingClientRect();
  handle.style.left = (hx) + 'px';
  handle.style.top = (hy) + 'px';
}

function cancelWireCurveDrag() {
  wireCurveDragging = null;
}

function getConnectorPin(partId, connectorId) {
  const div = document.getElementById('cp-' + partId);
  if (!div) return null;
  return div.querySelector(`.connector-pin[data-connector-id="${connectorId}"]`);
}

// ===== CONNECTOR HOVER / NET HIGHLIGHT =====
const connectorLabel = document.getElementById('connectorLabel');

/** Build adjacency map from wires: "partId:connectorId" keys. */
function buildWireAdjacency() {
  const adj = {};
  for (const w of canvasState.wires) {
    const a = w.f + ':' + w.fc;
    const b = w.t + ':' + w.tc;
    if (!adj[a]) adj[a] = [];
    if (!adj[b]) adj[b] = [];
    adj[a].push(b);
    adj[b].push(a);
  }
  return adj;
}

/** BFS from a connector to find all connectors on the same net.
 * Combines wire connections with internal part bus connections. */
function getNetConnectors(partId, connectorId) {
  const adj = buildWireAdjacency();
  
  // Add internal bus connections for each placed part
  for (const ps of canvasState.parts) {
    const part = findPartInDB(ps.partId);
    if (part && part.buses) {
      for (const bus of part.buses) {
        const members = bus.members || [];
        for (let i = 0; i < members.length; i++) {
          for (let j = i + 1; j < members.length; j++) {
            const a = ps.id + ':' + members[i];
            const b = ps.id + ':' + members[j];
            if (!adj[a]) adj[a] = [];
            if (!adj[b]) adj[b] = [];
            adj[a].push(b);
            adj[b].push(a);
          }
        }
      }
    }
  }
  
  const start = partId + ':' + connectorId;
  const visited = new Set([start]);
  const queue = [start];
  while (queue.length > 0) {
    const cur = queue.shift();
    for (const nb of (adj[cur] || [])) {
      if (!visited.has(nb)) {
        visited.add(nb);
        queue.push(nb);
      }
    }
  }
  return Array.from(visited);
}

/** Add a visual highlight to every connector on the same net as (partId, connectorId). */
function highlightNetConnectors(partId, connectorId) {
  clearNetHighlights();
  const net = getNetConnectors(partId, connectorId);
  for (const key of net) {
    const parts = key.split(':');
    const pid = parts[0];
    const cid = parts.slice(1).join(':'); // handle connector IDs that might contain colons
    const el = document.querySelector(`#cp-${pid} .connector-pin[data-connector-id="${CSS.escape(cid)}"]`);
    if (el) el.classList.add('net-highlight');
  }
}

function clearNetHighlights() {
  document.querySelectorAll('.connector-pin.net-highlight').forEach(el => el.classList.remove('net-highlight'));
}

function showConnectorLabel(partId, connectorId, name, pinEl) {
  const label = document.getElementById('connectorLabel');
  const pinRect = pinEl.getBoundingClientRect();
  const wrapperRect = wrapper.getBoundingClientRect();
  
  // Look up connector description and bus info from the part DB
  const partState = canvasState.parts.find(p => p.id === partId);
  const part = partState ? findPartInDB(partState.partId) : null;
  const connInfo = part ? (part.connectors || []).find(c => c.id === connectorId) : null;
  const connName = connInfo ? (connInfo.name || connInfo.description || '') : '';
  const connDesc = connInfo && connInfo.description && connInfo.description !== connInfo.name ? connInfo.description : '';
  
  // Find which bus this connector belongs to, if any
  let busId = '';
  if (part && part.buses) {
    for (const bus of part.buses) {
      if (bus.members.includes(connectorId)) {
        busId = bus.id;
        break;
      }
    }
  }
  
  let labelText = connName || connectorId;
  if (busId) labelText += '  [' + busId + ']';
  if (connDesc) labelText += ' — ' + connDesc;
  
  // Position label above and to the right of the connector pin
  let lx = pinRect.left - wrapperRect.left + pinRect.width + 6;
  let ly = pinRect.top - wrapperRect.top - 8;
  
  // Keep label within wrapper bounds
  const labelW = 280;
  const labelH = 30;
  if (lx + labelW > wrapper.clientWidth) {
    lx = pinRect.left - wrapperRect.left - labelW - 6;
  }
  if (ly < 0) ly = 2;
  if (ly + labelH > wrapper.clientHeight) ly = wrapper.clientHeight - labelH - 2;
  
  label.textContent = labelText;
  label.style.left = lx + 'px';
  label.style.top = ly + 'px';
  label.classList.add('visible');
  
  highlightNetConnectors(partId, connectorId);
}

function hideConnectorLabel() {
  document.getElementById('connectorLabel').classList.remove('visible');
  clearNetHighlights();
}

// ===== WIRE HOVER HIGHLIGHT =====

wrapper.addEventListener('mousemove', (e) => {
  if (wireDrawing || panState) return;
  const rect = wrapper.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  const hitWireId = findWireAtPoint(px, py);
  if (hitWireId && hitWireId !== highlightedWire) {
    highlightWire(hitWireId);
  } else if (!hitWireId && highlightedWire) {
    unhighlightWire();
  }
});

wrapper.addEventListener('mouseleave', () => {
  unhighlightWire();
});

// ===== PAN =====
let panState = null;

wrapper.onmousedown = (e) => {
  if (e.target.closest('.canvas-part')) return;
  if (e.target.closest('.connector-pin')) return;
  if (e.target.closest('.selection-toolbar')) return;
  if (e.target.closest('.wire-curve-handle')) return;
  
  // Check if clicking near a wire using geometric hit testing
  // We sample points along each wire's bezier path and check distance
  const wrapperRect2 = wrapper.getBoundingClientRect();
  const clickX = e.clientX - wrapperRect2.left;
  const clickY = e.clientY - wrapperRect2.top;
  let hitWireId = findWireAtPoint(clickX, clickY);
  if (hitWireId) {
    selectPart(null);
    selectWire(hitWireId);
    return;
  }
  
  // Deselect on empty canvas click
  selectWire(null);
  selectPart(null);
  
  panState = { sx: e.clientX, sy: e.clientY, vx: canvasState.viewport.x, vy: canvasState.viewport.y };
  wrapper.style.cursor = 'grabbing';
  
  const onMove = (ev) => {
    if (!panState) return;
    canvasState.viewport.x = panState.vx + (ev.clientX - panState.sx);
    canvasState.viewport.y = panState.vy + (ev.clientY - panState.sy);
    applyViewport();
  };
  const onUp = () => {
    panState = null;
    wrapper.style.cursor = 'default';
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
};

wrapper.onwheel = (e) => {
  e.preventDefault();
  const rect = wrapper.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  
  const d = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.max(0.1, Math.min(5, canvasState.viewport.scale * d));
  
  const vp = canvasState.viewport;
  vp.x = mx - (mx - vp.x) * (newScale / vp.scale);
  vp.y = my - (my - vp.y) * (newScale / vp.scale);
  vp.scale = newScale;
  
  applyViewport();
};

function drawGrid() {
  const canvas = document.getElementById('gridCanvas');
  const wrapper = document.getElementById('canvasWrapper');
  const vp = canvasState.viewport;
  
  canvas.width = wrapper.clientWidth;
  canvas.height = wrapper.clientHeight;
  
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  const spacing = GRID_PX * vp.scale;
  if (spacing < 4) return;
  
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  
  const offsetX = vp.x % spacing;
  const offsetY = vp.y % spacing;
  
  for (let x = offsetX; x < canvas.width; x += spacing) {
    ctx.moveTo(Math.round(x) + 0.5, 0);
    ctx.lineTo(Math.round(x) + 0.5, canvas.height);
  }
  for (let y = offsetY; y < canvas.height; y += spacing) {
    ctx.moveTo(0, Math.round(y) + 0.5);
    ctx.lineTo(canvas.width, Math.round(y) + 0.5);
  }
  ctx.stroke();
  
  const majorSpacing = spacing * 5;
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = offsetX; x < canvas.width; x += spacing) {
    if (Math.abs((x - offsetX) % majorSpacing) < 0.1) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, canvas.height);
    }
  }
  for (let y = offsetY; y < canvas.height; y += spacing) {
    if (Math.abs((y - offsetY) % majorSpacing) < 0.1) {
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(canvas.width, Math.round(y) + 0.5);
    }
  }
  ctx.stroke();
}

function applyViewport() {
  const vp = canvasState.viewport;
  container.style.transform = `translate(${vp.x}px, ${vp.y}px) scale(${vp.scale})`;
  container.style.transformOrigin = 'top left';
  drawGrid();
  renderWires();
  updateSelectionToolbar();
}

// ===== URL STATE =====
function saveStateToUrl() {
  const state = {
    d: debugShowSnap ? 1 : 0,
    p: canvasState.parts.map(pt => ({
      i: pt.partId,
      x: Math.round(pt.x * 10) / 10,
      y: Math.round(pt.y * 10) / 10,
      r: pt.rotation || 0
    })),
    w: canvasState.wires.map(w => {
      const fi = canvasState.parts.findIndex(p => p.id === w.f);
      const ti = canvasState.parts.findIndex(p => p.id === w.t);
      return [fi, w.fc, ti, w.tc, w.color || '#ffaa00', w.curve || 0, w.auto ? 1 : 0];
    })
  };
  const json = JSON.stringify(state);
  const compressed = btoa(encodeURIComponent(json)).replace(/=+$/, '');
  window.location.hash = compressed;
}

function loadStateFromUrl() {
  const hash = window.location.hash.slice(1);
  if (!hash) return;
  try {
    const json = decodeURIComponent(atob(hash));
    const state = JSON.parse(json);
    
    if (state.p) {
      state.p.forEach(sp => {
        const part = findPartInDB(sp.i);
        if (!part) return;
        const id = 'p' + (nextPartId++);
        const displayScale = getPartDisplayScale(part);
        canvasState.parts.push({ partId: sp.i, id, x: sp.x || 0, y: sp.y || 0, rotation: sp.r || 0, displayScale });
      });
    }
    
    const renderPromises = canvasState.parts.map(p => renderPart(p.id));
    Promise.all(renderPromises).then(() => {
      if (state.w) {
        state.w.forEach(w => {
          const from = canvasState.parts[w[0]];
          const to = canvasState.parts[w[2]];
          if (from && to) {
            canvasState.wires.push({
              id: 'w' + (nextWireId++),
              f: from.id, fc: w[1],
              t: to.id, tc: w[3],
              color: w[4] || '#ffaa00',
              curve: w[5] || 0,
              auto: w[6] === 1
            });
          }
        });
        renderWires();
      }
      updateStatus();
      if (canvasState.parts.length > 0) hideEmptyState();
      if (state.hasOwnProperty('d')) toggleDebug(state.d !== 0);
    });
  } catch (e) {
    console.error('Failed to load state:', e);
  }
}

// ===== SHARE =====
function copyShareLink() {
  saveStateToUrl();
  navigator.clipboard.writeText(window.location.href).then(() => {
    document.getElementById('statusText').textContent = '✅ Share link copied!';
    setTimeout(() => { document.getElementById('statusText').textContent = ''; updateStatus(); }, 2000);
  }).catch(() => {
    prompt('Copy this URL:', window.location.href);
  });
}

// ===== CLEAR =====
function clearAll() {
  if (!confirm('Clear all parts and wires?')) return;
  canvasState.parts = []; canvasState.wires = []; selectedWire = null;
  document.getElementById('wireCurveHandle')?.remove();
  container.innerHTML = '';
  wiresSvg.innerHTML = '';
  document.getElementById('emptyState').style.display = '';
  // Clean up dropped part data from partsDB
  cleanupDroppedParts();
  updateWireSelectionToolbar();
  updateStatus();
  window.location.hash = '';
}

// ===== KEYBOARD =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    const sel = document.querySelector('.canvas-part.selected');
    if (sel) { deletePart(sel.dataset.partId); e.preventDefault(); }
    else if (selectedWire) { deleteSelectedWire(); e.preventDefault(); }
  }
  if (e.key === 'r' || e.key === 'R') {
    const sel = document.querySelector('.canvas-part.selected');
    if (sel) {
      const st = canvasState.parts.find(p => p.id === sel.dataset.partId);
      if (st) {
        st.rotation = (st.rotation + 90) % 360;
        sel.style.transform = `rotate(${st.rotation}deg)`;
        renderWires();
        saveStateToUrl();
        updateSelectionToolbar();
      }
    }
  }
  // Z-order shortcuts: ] = bring forward, [ = send backward, } = bring to front, { = send to back
  if (e.key === ']') {
    const sel = document.querySelector('.canvas-part.selected');
    if (sel) { zOrderSelected(e.shiftKey ? 'front' : 'forward'); e.preventDefault(); }
  }
  if (e.key === '[') {
    const sel = document.querySelector('.canvas-part.selected');
    if (sel) { zOrderSelected(e.shiftKey ? 'back' : 'backward'); e.preventDefault(); }
  }
});

function deletePart(partId) {
  canvasState.wires = canvasState.wires.filter(w => {
    if (w.id === selectedWire) selectedWire = null;
    return w.f !== partId && w.t !== partId;
  });
  canvasState.parts = canvasState.parts.filter(p => p.id !== partId);
  const el = document.getElementById('cp-' + partId);
  if (el) el.remove();
  document.getElementById('wireCurveHandle')?.remove();
  // Clean up dropped part data from partsDB if this was a dropped part
  cleanupSingleDroppedPart(partId);
  renderWires();
  updateStatus();
  saveStateToUrl();
  selectPart(null);
  if (canvasState.parts.length === 0) document.getElementById('emptyState').style.display = '';
}

// ===== RESIZE =====
window.addEventListener('resize', () => {
  drawGrid();
  renderWires();
});

// ===== WIRE LIST PANEL =====
let wireListExpanded = true;

function toggleWireList() {
  wireListExpanded = !wireListExpanded;
  const body = document.getElementById('wireListBody');
  const arrow = document.getElementById('wireListArrow');
  if (wireListExpanded) {
    body.style.display = 'block';
    arrow.classList.add('expanded');
  } else {
    body.style.display = 'none';
    arrow.classList.remove('expanded');
  }
}

// Track expanded/collapsed state for each group key 'fromPartId:toPartId'
let wireTreeExpanded = {};

function toggleWireTreeGroup(key) {
  wireTreeExpanded[key] = !wireTreeExpanded[key];
  const body = document.querySelector(`.wire-tree-children[data-group="${key}"]`);
  const arrow = document.querySelector(`.wire-tree-header[data-group="${key}"] .arrow`);
  if (body && arrow) {
    body.style.display = wireTreeExpanded[key] ? 'block' : 'none';
    arrow.classList.toggle('expanded', wireTreeExpanded[key]);
  }
}

function updateWireList() {
  const items = document.getElementById('wireListItems');
  const empty = document.getElementById('wireListEmpty');
  const count = document.getElementById('wireCountDisplay');
  
  count.textContent = canvasState.wires.length;
  
  if (canvasState.wires.length === 0) {
    empty.style.display = 'block';
    items.innerHTML = '';
    return;
  }
  empty.style.display = 'none';
  
  // Group wires by (fromPart, toPart) pair, with canonical key
  const groups = new Map();
  
  for (let i = canvasState.wires.length - 1; i >= 0; i--) {
    const w = canvasState.wires[i];
    const fromState = canvasState.parts.find(p => p.id === w.f);
    const toState = canvasState.parts.find(p => p.id === w.t);
    if (!fromState || !toState) continue;
    
    const fromPart = findPartInDB(fromState.partId);
    const toPart = findPartInDB(toState.partId);
    if (!fromPart || !toPart) continue;
    
    // Canonical key: sort from/to alphabetically by part title
    const fromTitle = fromPart.title;
    const toTitle = toPart.title;
    let key, displayFrom, displayTo, displayFromState, displayFromPart, displayToPart;
    if (fromTitle < toTitle || (fromTitle === toTitle && fromState.id < toState.id)) {
      key = fromState.id + ':' + toState.id;
      displayFrom = fromTitle; displayTo = toTitle;
      displayFromState = fromState; displayToState = toState;
      displayFromPart = fromPart; displayToPart = toPart;
    } else {
      key = toState.id + ':' + fromState.id;
      displayFrom = toTitle; displayTo = fromTitle;
      displayFromState = toState; displayToState = fromState;
      displayFromPart = toPart; displayToPart = fromPart;
    }
    
    if (!groups.has(key)) {
      groups.set(key, {
        fromPart: displayFromPart, toPart: displayToPart,
        fromState: displayFromState, toState: displayToState,
        fromTitle: displayFrom, toTitle: displayTo,
        wires: []
      });
    }
    groups.get(key).wires.push(w);
  }
  
  let html = '';
  for (const [key, group] of groups) {
    const isExpanded = wireTreeExpanded[key] !== false; // default expanded
    html += `<div class="wire-tree-group">
      <div class="wire-tree-header" data-group="${key}" onclick="toggleWireTreeGroup('${key}')">
        <span class="arrow ${isExpanded ? 'expanded' : ''}">▶</span>
        <span class="wire-tree-from">${escHtml(group.fromTitle)}</span>
        <span class="wire-tree-arrow">→</span>
        <span class="wire-tree-to">${escHtml(group.toTitle)}</span>
        <span class="wire-tree-count">${group.wires.length}</span>
      </div>
      <div class="wire-tree-children" data-group="${key}" style="display:${isExpanded ? 'block' : 'none'}">`;
    
    for (const w of group.wires) {
      const fromConn = (group.fromPart.connectors || []).find(c => c.id === w.fc);
      const toConn = (group.toPart.connectors || []).find(c => c.id === w.tc);
      const fromConnName = fromConn ? (fromConn.name || fromConn.id) : w.fc;
      const toConnName = toConn ? (toConn.name || toConn.id) : w.tc;
      const color = w.color || '#ffaa00';
      const isSelected = (selectedWire === w.id);
      
      html += `<div class="wire-tree-item" data-wire-id="${w.id}" style="${isSelected ? 'background:#2a3a4a;color:#fff' : ''}" onclick="selectWireListItem('${w.id}')" title="${escHtml(group.fromTitle)}:${escHtml(fromConnName)} → ${escHtml(group.toTitle)}:${escHtml(toConnName)}">
        <span class="wire-color-dot" style="background:${color}"></span>
        <span class="wire-conn-from">${escHtml(fromConnName)}</span>
        <span class="wire-conn-arrow">→</span>
        <span class="wire-conn-to">${escHtml(toConnName)}</span>
      </div>`;
    }
    
    html += `</div></div>`;
  }
  items.innerHTML = html;
}

function selectWireListItem(wireId) {
  selectPart(null);
  selectWire(wireId);
  updateWireList();
}

function copyWiresAsJson() {
  const wireData = canvasState.wires.map(w => {
    const fromState = canvasState.parts.find(p => p.id === w.f);
    const toState = canvasState.parts.find(p => p.id === w.t);
    const fromPart = fromState ? findPartInDB(fromState.partId) : null;
    const toPart = toState ? findPartInDB(toState.partId) : null;
    const fromConn = fromPart ? (fromPart.connectors || []).find(c => c.id === w.fc) : null;
    const toConn = toPart ? (toPart.connectors || []).find(c => c.id === w.tc) : null;
    return {
      from: {
        partId: w.f,
        partTitle: fromPart ? fromPart.title : w.f,
        connectorId: w.fc,
        connectorName: fromConn ? (fromConn.name || fromConn.id) : w.fc
      },
      to: {
        partId: w.t,
        partTitle: toPart ? toPart.title : w.t,
        connectorId: w.tc,
        connectorName: toConn ? (toConn.name || toConn.id) : w.tc
      },
      color: w.color || '#ffaa00',
      curve: w.curve || 0
    };
  });
  
  const json = JSON.stringify(wireData, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    document.getElementById('statusText').textContent = '✅ Wire JSON copied!';
    setTimeout(() => { document.getElementById('statusText').textContent = ''; updateStatus(); }, 2000);
  }).catch(() => {
    prompt('Copy wire JSON:', json);
  });
}
